<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" fill="none">
  <!-- Background -->
  <rect width="700" height="400" rx="32" fill="#f8fafc"/>

  <!-- Grid lines -->
  <line x1="0" y1="133" x2="700" y2="133" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="267" x2="700" y2="267" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="233" y1="0" x2="233" y2="400" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="467" y1="0" x2="467" y2="400" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Central gradient circle -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <ellipse cx="350" cy="200" rx="220" ry="160" fill="url(#glow)"/>

  <!-- Job cards floating -->
  <!-- Card 1 -->
  <rect x="40" y="60" width="180" height="100" rx="16" fill="white" filter="url(#shadow)"/>
  <rect x="40" y="60" width="180" height="8" rx="8" fill="url(#card1)"/>
  <rect x="56" y="82" width="80" height="10" rx="5" fill="#1e293b"/>
  <rect x="56" y="100" width="56" height="8" rx="4" fill="#94a3b8"/>
  <rect x="56" y="116" width="40" height="16" rx="8" fill="#ede9fe"/>
  <text x="76" y="128" font-size="8" fill="#6366f1" font-family="sans-serif" font-weight="600">Hiring</text>
  <rect x="176" y="116" width="32" height="16" rx="8" fill="#f0fdf4"/>
  <text x="183" y="128" font-size="8" fill="#10b981" font-family="sans-serif" font-weight="600">3 open</text>
  <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.08"/></filter>

  <!-- Card 2 -->
  <rect x="480" y="40" width="180" height="100" rx="16" fill="white" filter="url(#shadow)"/>
  <rect x="480" y="40" width="180" height="8" rx="8" fill="url(#card2)"/>
  <rect x="496" y="62" width="96" height="10" rx="5" fill="#1e293b"/>
  <rect x="496" y="80" width="60" height="8" rx="4" fill="#94a3b8"/>
  <rect x="496" y="96" width="60" height="16" rx="8" fill="#fff7ed"/>
  <text x="508" y="108" font-size="8" fill="#f97316" font-family="sans-serif" font-weight="600">Urgent</text>
  <rect x="622" y="96" width="26" height="16" rx="8" fill="#f0fdf4"/>
  <text x="628" y="108" font-size="8" fill="#10b981" font-family="sans-serif" font-weight="600">5+</text>

  <!-- Card 3 -->
  <rect x="100" y="240" width="180" height="100" rx="16" fill="white" filter="url(#shadow)"/>
  <rect x="100" y="240" width="180" height="8" rx="8" fill="url(#card3)"/>
  <rect x="116" y="262" width="72" height="10" rx="5" fill="#1e293b"/>
  <rect x="116" y="280" width="50" height="8" rx="4" fill="#94a3b8"/>
  <rect x="116" y="296" width="44" height="16" rx="8" fill="#ecfdf5"/>
  <text x="126" y="308" font-size="8" fill="#10b981" font-family="sans-serif" font-weight="600">Active</text>

  <!-- Card 4 -->
  <rect x="420" y="260" width="200" height="100" rx="16" fill="white" filter="url(#shadow)"/>
  <rect x="420" y="260" width="200" height="8" rx="8" fill="url(#card1)"/>
  <rect x="436" y="282" width="110" height="10" rx="5" fill="#1e293b"/>
  <rect x="436" y="300" width="70" height="8" rx="4" fill="#94a3b8"/>
  <rect x="436" y="316" width="52" height="16" rx="8" fill="#ede9fe"/>
  <text x="448" y="328" font-size="8" fill="#6366f1" font-family="sans-serif" font-weight="600">Remote</text>

  <!-- Center logo mark -->
  <circle cx="350" cy="200" r="48" fill="white" filter="url(#shadow)"/>
  <circle cx="350" cy="200" r="40" fill="url(#card1)" opacity="0.9"/>
  <text x="350" y="207" text-anchor="middle" font-size="26" fill="white" font-family="sans-serif" font-weight="900">R</text>

  <!-- Connecting lines -->
  <line x1="220" y1="110" x2="310" y2="170" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="480" y1="115" x2="390" y2="170" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="280" y1="290" x2="320" y2="235" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="425" y1="305" x2="390" y2="240" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.3"/>

  <!-- Floating dots -->
  <circle cx="160" cy="200" r="5" fill="#6366f1" opacity="0.3"/>
  <circle cx="540" cy="200" r="5" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="350" cy="80" r="5" fill="#10b981" opacity="0.3"/>
  <circle cx="350" cy="320" r="5" fill="#8b5cf6" opacity="0.3"/>
</svg>
